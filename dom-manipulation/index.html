<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Quote Generator with Filtering</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🌟 Dynamic Quote Generator</h1>
  </header>

  <main>
    <div id="quoteContainer">
      <p id="quoteText">Click "New Quote" to get started!</p>
      <p id="quoteCategory" class="category"></p>
    </div>

    <div class="controls">
      <button id="newQuoteBtn">New Quote</button>

      <select id="categoryFilter" onchange="filterQuotes()">
        <option value="all">All Categories</option>
      </select>
    </div>

    <h3>Add Your Own Quote</h3>
    <form id="addQuoteForm">
      <input type="text" id="newQuote" placeholder="Enter your quote..." required />
      <input type="text" id="newCategory" placeholder="Enter category..." required />
      <button type="submit">Add Quote</button>
    </form>

    <h3>Import / Export Quotes</h3>
    <div class="import-export">
      <button id="exportBtn">Export Quotes (JSON)</button>
      <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Dynamic Quote Generator</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <!-- Category Filter -->
  <label for="categoryFilter">Filter by Category:</label>
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>

  <!-- Quote Display Area -->
  <div id="quoteDisplay"></div>

  <!-- Add Quote Form -->
  <h3>Add a New Quote</h3>
  <form id="addQuoteForm" onsubmit="addQuote(event)">
    <input type="text" id="quoteText" placeholder="Enter quote" required />
    <input type="text" id="quoteAuthor" placeholder="Author" required />
    <input type="text" id="quoteCategory" placeholder="Category" required />
    <button type="submit">Add Quote</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
