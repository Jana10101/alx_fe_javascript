<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <!-- Category Filter -->
  <label for="categoryFilter">Filter by Category:</label>
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>

  <!-- Quote Display -->
  <div id="quoteDisplay"></div>

  <!-- New Quote Form -->
  <h3>Add a New Quote</h3>
  <form id="addQuoteForm" onsubmit="addQuote(event)">
    <input type="text" id="newQuoteText" placeholder="Enter a new quote" required>
    <input type="text" id="newQuoteAuthor" placeholder="Enter author" required>
    <input type="text" id="newQuoteCategory" placeholder="Enter category" required>
    <button type="submit">Add Quote</button>
  </form>

  <button id="newQuote">Show Random Quote</button>

  <hr>

  <!-- JSON Import/Export -->
  <button onclick="exportToJsonFile()">Export Quotes (JSON)</button>
  <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />

  <p id="syncStatus"></p>
  <div id="app">
  <h1>Dynamic Quote Generator</h1>
  <p id="quoteDisplay">Loading quote...</p>

  <label for="categoryFilter">Filter by category:</label>
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>

  <button id="newQuote">Show New Quote</button>
  <p id="syncStatus" style="color: green; font-weight: bold;"></p>
</div>

<script src="script.js"></script>


  <script src="script.js"></script>
</body>
</html>
