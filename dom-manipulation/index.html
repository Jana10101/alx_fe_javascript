<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <!-- Category Filter -->
  <label for="categoryFilter">Filter by Category:</label>
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>

  <!-- Quote Display -->
  <div id="quoteDisplay"></div>

  <!-- Add New Quote -->
  <h3>Add a New Quote</h3>
  <form id="addQuoteForm" onsubmit="addQuote(event)">
    <input type="text" id="newQuoteText" placeholder="Enter a new quote" required>
    <input type="text" id="newQuoteCategory" placeholder="Enter category" required>
    <button type="submit">Add Quote</button>
  </form>

  <button id="newQuote">Show Random Quote</button>

  <!-- Sync Status -->
  <p id="syncStatus" style="font-weight: bold; color: green;"></p>

  <!-- Import/Export -->
  <button id="exportQuotesBtn">Export Quotes (JSON)</button>
  <input type="file" id="importFile" accept=".json" style="display:none" />

  <script src="script.js"></script>
</body>
</html>
